[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-ground-interpreter"
version = "0.2.0"
description = "A bounded interpreter with signal-state execution and predictive transition-ground compilation"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Virtual Ground research"}]
dependencies = []

[project.scripts]
vgi = "vgi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vgi*"]
